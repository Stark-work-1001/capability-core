[workspace]
resolver = "2"
members = [
    "crates/ac-core",
    "crates/ac-registry",
    "crates/ac-retrieval",
    "crates/ac-llm",
    "crates/ac-mcp",
    "crates/ac-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["CapabilityCore Project"]

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
